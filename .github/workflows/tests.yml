# Tests automatiques à chaque push : si un test casse, la croix rouge apparaît sur GitHub
# (onglet « Actions ») avant que la version parte sur Render.
name: Tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
